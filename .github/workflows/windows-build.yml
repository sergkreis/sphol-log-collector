name: Windows portable validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.9'
          architecture: x64
      - run: python -m pip install --require-hashes --only-binary=":all:" -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - name: Native Tk synthetic capture and shutdown smoke
        run: python -m tools.native_gui_smoke
      - name: Native pairing recovery real buttons (offline)
        run: python -m unittest tools.native_pairing_smoke -v
      - name: Native single Start streams and identity isolation
        run: python -m tools.native_single_smoke
      - run: python -m pip install --require-hashes --only-binary=":all:" -r requirements-build.txt
      - run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name SPHOLLogCollector --add-data "collector/assets;collector/assets" run_collector.py
      - name: Frozen EXE connection states, single Start, consent, counters and isolation
        env:
          SPHOL_SMOKE_EVIDENCE: smoke-reports
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke-reports | Out-Null
          $report = Join-Path $pwd 'smoke-reports/frozen-smoke.txt'
          $process = Start-Process -FilePath dist/SPHOLLogCollector.exe -ArgumentList @('--synthetic-smoke-report', "`"$report`"") -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Frozen smoke timed out' }
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Frozen smoke failed' }
          if (-not (Select-String -Path $report -Pattern '^OK \(skipped=1\)$' -Quiet)) { throw 'Expected success with exactly one private-fixture skip' }
          $skips = @(Select-String -Path $report -Pattern ' \.\.\. skipped ')
          if ($skips.Count -ne 1 -or $skips[0].Line -notmatch "^test_primary_restart_before_approval_real_http_probe .* \.\.\. skipped 'Private isolated HTTP fixture required'$") { throw 'Unexpected frozen smoke skip' }
          if (-not (Select-String -Path $report -Pattern '^test_compact_binding_capture_settings_and_callbacks .* \.\.\. ok$' -Quiet)) { throw 'Missing frozen compact UI gate' }
          if (-not (Select-String -Path $report -Pattern '^test_unresolved_sources_do_not_starve_live_file .* \.\.\. ok$' -Quiet)) { throw 'Missing frozen recovery isolation gate' }
          if (-not (Select-String -Path $report -Pattern '^test_multi_recovery_queuefull_commit_fault_reopen .* \.\.\. ok$' -Quiet)) { throw 'Missing frozen combined recovery fault gate' }
          if (-not (Select-String -Path $report -Pattern '^test_tk_fault_pending_ack_green_and_reopen .* \.\.\. ok$' -Quiet)) { throw 'Missing frozen actual Tk fault ACK gate' }
          if (-not (Select-String -Path $report -Pattern '^test_callback_fault_fails_closed .* \.\.\. ok$' -Quiet)) { throw 'Missing frozen scheduler fault gate' }
          if (-not (Select-String -Path $report -Pattern '^test_visible_retry_consent_expiry_stale_and_copy .* \.\.\. ok$' -Quiet)) { throw 'Missing frozen pairing real-button gate' }
          if (-not (Select-String -Path $report -Pattern '^test_late_redemption_waits_and_requires_explicit_resume .* \.\.\. ok$' -Quiet)) { throw 'Missing frozen late-token storage gate' }
          if (-not (Select-String -Path $report -Pattern '^test_layout_independent_paste_event_route .* \.\.\. ok$' -Quiet)) { throw 'Missing frozen Windows EN/RU Ctrl+V gate' }
          if (-not (Select-String -Path $report -Pattern '^test_site_code_button_dpapi_and_lost_response .* \.\.\. ok$' -Quiet)) { throw 'Missing frozen site-code DPAPI button gate' }
          if (-not (Select-String -Path $report -Pattern '^test_visible_open_eve_button_fresh_waiting_and_legacy_pending .* \.\.\. ok$' -Quiet)) { throw 'Missing frozen direct-EVE visible button gate' }
          if (-not (Select-String -Path $report -Pattern '^test_native_dpapi_separate_browser_proof .* \.\.\. ok$' -Quiet)) { throw 'Missing frozen browser recovery DPAPI gate' }
      - name: Build isolated updater dummy (never collector state)
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name UpdateDummy tools/update_dummy.py
      - name: Build distinct replacement dummy
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name UpdateDummyNew tools/update_dummy.py
      - name: Frozen self-update against isolated dummy executable
        run: python -m tools.native_update_smoke dist/SPHOLLogCollector.exe dist/UpdateDummy.exe dist/UpdateDummyNew.exe
      - name: Pinned released v0.3.10 to real new collector replacement and DPAPI preservation (egress blocked)
        shell: pwsh
        run: |
          python -m tools.native_cross_version_smoke dist/SPHOLLogCollector.exe 2>&1 | Tee-Object smoke-reports/cross-version.txt
          if ($LASTEXITCODE -ne 0) { throw 'Cross-version preservation failed' }
      - name: Generate version-bound update manifest
        run: python -m tools.make_update_manifest dist/SPHOLLogCollector.exe
      - shell: pwsh
        run: |
          $hash = (Get-FileHash dist/SPHOLLogCollector.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SPHOLLogCollector.exe" | Set-Content dist/SHA256SUMS.txt
          git rev-parse HEAD | Set-Content dist/SOURCE-COMMIT.txt
      - name: Upload unsigned candidate for native testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SPHOLLogCollector-windows-x64-${{ github.sha }}
          path: |
            dist/SPHOLLogCollector.exe
            dist/update-manifest.json
            dist/SHA256SUMS.txt
            dist/SOURCE-COMMIT.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false
      # Candidate artifact only: no GitHub Release, signing or attestation.
      - name: Upload synthetic acceptance evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SPHOL-smoke-evidence-${{ github.sha }}
          path: smoke-reports/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false
